name: Update profile summary cards

on:
  schedule:
    # GitHub Actions cron uses UTC; 00:17 UTC is 08:17 in Asia/Shanghai.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  generate:
    name: Generate self-hosted profile cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate and commit profile cards
        # Pinned release of vn7n24fzkq/github-profile-summary-cards.
        uses: vn7n24fzkq/github-profile-summary-cards@bbad2a3b8a67e98c7a347906fe70ee9e1c81b1fb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: nanbloom001
          BRANCH_NAME: main
          UTC_OFFSET: 8
          AUTO_PUSH: true
          NAME: nanbloom001
